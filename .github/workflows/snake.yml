name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: Rosellines
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#00FF00&color_dots=#FF8800&color_bg=#0D1117&grid_size_y=8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFFFFF&color_dots=#FF8800&color_bg=#0D1117&grid_size_y=8

      - name: Publish snake assets to output branch
        run: |
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git worktree add output-branch refs/remotes/origin/output
          else
            git worktree add -b output output-branch
          fi

          cp dist/github-snake.svg output-branch/
          cp dist/github-snake-dark.svg output-branch/

          cd output-branch
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add github-snake.svg github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "No snake changes to commit."
            exit 0
          fi

          git commit -m "chore: update github snake"
          git push origin HEAD:output
